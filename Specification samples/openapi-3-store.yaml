openapi: 3.0.3
info:
  title: Store API
  version: 1.0.0
servers:
  - url: https://api.example.com/v2
paths:
  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getOrderById
      responses:
        '200':
          description: Order found
    put:
      operationId: replaceOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                priority:
                  type: integer
      responses:
        '200':
          description: Replaced
  /orders/search:
    get:
      operationId: searchOrders
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: includeArchived
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Search results
